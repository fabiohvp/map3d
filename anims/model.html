<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo 3D — Britannia</title>
<style>
  :root { --fg:#e6ece9; --muted:#8fa19a; --accent:#6cc4a8; --line:rgba(255,255,255,.09); --font:"Segoe UI",system-ui,sans-serif; }
  html, body { margin:0; height:100%; background:#1b1e22; color:var(--fg); font:13px var(--font); overflow:hidden; }
  canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }
  .bar { position:absolute; left:12px; top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .bar select { background:#14181a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:13px var(--font); }
  .bar input { width:64px; background:#14181a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:13px var(--font); }
  .bar button { background:rgba(20,24,26,.85); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 9px; cursor:pointer; font:12px var(--font); }
  .bar button.on { background:var(--accent); color:#0d1714; border-color:var(--accent); }
  #info { position:absolute; left:12px; bottom:10px; color:var(--muted); font:11px Consolas,monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <label>corpo <input id="id" value="2"></label>
  <select id="kind"><option value="ai">forma IA</option><option value="">casco</option></select>
  <button id="spin" class="on">girar</button>
  <button id="wire">malha</button>
  <button id="flat">sem luz</button>
</div>
<div id="info"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
// fundo em degrade escuro, como um visualizador de modelos
const bg = document.createElement('canvas');
bg.width = 2; bg.height = 256;
const g = bg.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
gr.addColorStop(0, '#2e3238'); gr.addColorStop(1, '#141619');
g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
scene.background = new THREE.CanvasTexture(bg);
scene.background.colorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.5;

scene.add(new THREE.HemisphereLight(0xf2f4f8, 0x6a5a4a, 2.0));
const key = new THREE.DirectionalLight(0xfff3e0, 1.4);
key.position.set(-2, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.8);
rim.position.set(2, 2, -3);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

let model = null;
const info = document.getElementById('info');

const kind = document.getElementById('kind');
function load(id) {
  const file = `data/3d/${id}${kind.value ? '.' + kind.value : ''}.glb`;
  new GLTFLoader().load(file, gltf => {
    if (model) scene.remove(model);
    model = gltf.scene;
    let tris = 0;
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      const col = o.geometry.attributes.color;
      if (col) {
        // cor do sprite e sRGB; o three trata cor de vertice como linear
        const lin = new Float32Array(col.count * 3), cc = new THREE.Color();
        for (let i = 0; i < col.count; i++) {
          cc.setRGB(col.getX(i), col.getY(i), col.getZ(i), THREE.SRGBColorSpace);
          lin[i * 3] = cc.r; lin[i * 3 + 1] = cc.g; lin[i * 3 + 2] = cc.b;
        }
        o.geometry.setAttribute('color', new THREE.BufferAttribute(lin, 3));
      }
      // pedaco sem cor de vertice = rosto com textura
      const look = col ? { vertexColors: true } : { map: o.material.map };
      o.userData.lit = new THREE.MeshStandardMaterial({ ...look, roughness: 0.85, metalness: 0 });
      o.userData.flat = new THREE.MeshBasicMaterial(look);
      o.material = o.userData.lit;
      tris += o.geometry.index.count / 3;
    });
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    controls.target.set(c.x, size.y * 0.5, c.z);
    camera.position.set(c.x, size.y * 0.62, c.z + size.y * 2.6);
    key.shadow.camera.left = key.shadow.camera.bottom = -size.y;
    key.shadow.camera.right = key.shadow.camera.top = size.y;
    key.shadow.camera.updateProjectionMatrix();
    controls.update();
    info.textContent = `${file} · ${tris.toLocaleString('pt-BR')} triângulos · ${size.y.toFixed(2)} tiles de altura`;
    document.getElementById('wire').classList.remove('on');
    document.getElementById('flat').classList.remove('on');
  }, undefined, () => {
    info.textContent = `sem ${file} — gere com: python -I anims/${kind.value ? 'ai3d' : 'model3d'}.py --only ${id}`;
  });
}

const meshes = () => { const r = []; model && model.traverse(o => o.isMesh && r.push(o)); return r; };
document.getElementById('spin').onclick = e => { controls.autoRotate = e.target.classList.toggle('on'); };
document.getElementById('wire').onclick = e => { const on = e.target.classList.toggle('on'); meshes().forEach(m => { m.material.wireframe = on; }); };
document.getElementById('flat').onclick = e => {
  const on = e.target.classList.toggle('on'), w = document.getElementById('wire').classList.contains('on');
  meshes().forEach(m => { m.material = on ? m.userData.flat : m.userData.lit; m.material.wireframe = w; });
};
const idIn = document.getElementById('id');
idIn.value = new URLSearchParams(location.search).get('id') || '2';
idIn.onchange = kind.onchange = () => load(parseInt(idIn.value, 0) || idIn.value);
kind.value = new URLSearchParams(location.search).get('kind') ?? 'ai';
load(idIn.value);

// vista do sprite: azimute 45k graus (k = direcao do arquivo), elevacao atan 1/2, quase ortografica
function spriteView(k) {
  controls.autoRotate = false;
  document.getElementById('spin').classList.remove('on');
  const t = controls.target, d = camera.position.distanceTo(t), el = Math.atan(0.5), az = k * Math.PI / 4;
  camera.position.set(t.x + d * Math.sin(az) * Math.cos(el), t.y + d * Math.sin(el), t.z + d * Math.cos(az) * Math.cos(el));
  controls.update();
}
window.view3d = { camera, controls, scene, spriteView };

function frame() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * devicePixelRatio) || canvas.height !== Math.floor(h * devicePixelRatio)) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
