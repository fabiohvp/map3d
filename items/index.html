<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itens 3D — Britannia</title>
<style>
  :root { --bg:#14181a; --card:#1c2225; --fg:#e6ece9; --muted:#8fa19a; --accent:#6cc4a8; --line:rgba(255,255,255,.09);
          --font:"Segoe UI",system-ui,sans-serif; --mono:"Cascadia Code",Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 var(--font); }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  header { padding:22px 24px 6px; max-width:1500px; margin:auto; }
  h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:var(--muted); }
  header a { color:var(--accent); }
  main { max-width:1500px; margin:auto; padding:16px 24px 40px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); position:relative; z-index:2; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .view { height:300px; cursor:grab; touch-action:none; }
  .view:active { cursor:grabbing; }
  .info { padding:12px 14px 14px; border-top:1px solid var(--line); }
  .info h2 { margin:0; font-size:16px; display:flex; gap:8px; align-items:center; }
  .tag { font-size:11px; font-weight:600; padding:1px 8px; border-radius:99px; background:rgba(108,196,168,.15); color:var(--accent); }
  .tag.set { background:rgba(230,170,90,.16); color:#e6aa5a; }
  .note { color:var(--muted); font-size:12px; margin:2px 0 10px; }
  .orig { display:flex; align-items:flex-end; gap:6px; flex-wrap:wrap; padding:8px; background:#8a8a86; border-radius:8px; min-height:60px; }
  .orig figure { margin:0; text-align:center; }
  .orig img { image-rendering:pixelated; display:block; max-height:120px; width:auto; }
  .orig figcaption { font:10px var(--mono); color:#181818; }
  .lbl { font-size:11px; color:var(--muted); margin:10px 0 4px; letter-spacing:.04em; text-transform:uppercase; }
  .bar { max-width:1500px; margin:auto; padding:10px 24px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:relative; z-index:4; }
  .bar select, .bar input[type=search] { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:13px var(--font); }
  .bar button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:13px var(--font); }
  .bar button.on { background:var(--accent); color:#0d1714; border-color:var(--accent); font-weight:600; }
  .bar button:disabled { opacity:.35; cursor:default; }
  .bar label { display:flex; gap:5px; align-items:center; color:var(--muted); }
  .bar .sp { flex:1; }
  [hidden] { display:none !important; }
  .thumb { background-repeat:no-repeat; image-rendering:pixelated; }
  .meta { font:11px var(--mono); color:var(--muted); margin-top:6px; word-break:break-all; }
  .pal { display:inline-flex; gap:3px; vertical-align:middle; margin-left:6px; }
  .pal i { width:12px; height:12px; border-radius:3px; border:1px solid rgba(255,255,255,.2); }
  .tag.cat { background:rgba(120,150,230,.16); color:#8fb0f0; }
  #msg { padding:40px 24px; max-width:700px; margin:auto; color:#e6aa5a; display:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header>
  <h1>Itens 3D — protótipo</h1>
  <p>10 itens do tiledata/art clássicos modelados em 3D com texturas procedurais (madeira, tecido, pedra, ferro). Peças vizinhas que formam um móvel viraram um item único. Arraste para girar, role para aproximar. · <a href="../index.html">← mapa</a></p>
</header>
<div class="bar">
  <button id="tab-hero" class="on">Destaques (10 modelados à mão)</button>
  <button id="tab-all">Todos (gerados automaticamente)</button>
  <span class="sp"></span>
</div>
<div class="bar" id="filters" hidden>
  <select id="f-cat"></select>
  <select id="f-kind"><option value="">conjuntos + peças</option><option value="set">só conjuntos</option><option value="single">só peças únicas</option></select>
  <select id="f-mode"><option value="fiel">modelo fiel à arte</option><option value="proc">modelo procedural</option></select>
  <input id="f-q" type="search" placeholder="buscar nome ou id (ex.: 0A63)">
  <label><input id="f-abs" type="checkbox" checked> ocultar peças absorvidas por conjuntos</label>
  <span class="sp"></span>
  <span id="count" style="color:var(--muted)"></span>
  <button id="prev">←</button><span id="pg" style="color:var(--muted)"></span><button id="next">→</button>
</div>
<div id="msg"></div>
<main id="grid"></main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="app.js"></script>
<script>
  if (location.protocol === 'file:') {
    const m = document.getElementById('msg');
    m.style.display = 'block';
    m.innerHTML = 'Abra por um servidor local (módulos ES não carregam via file://): <code>npx serve .</code> na pasta <code>map3d</code> e acesse <code>/items/</code>.';
  }
</script>
</body>
</html>
