<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Britannia 3D Web · Map 4 (Tokuno Islands)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="glcanvas"></canvas>

    <!-- Top Left Title and Coordinates HUD -->
    <header class="hud-panel top-left">
      <div class="hud-brand">
        <span class="logo-mark">⚔</span>
        <div>
          <h1>Britannia 3D Web</h1>
          <p class="subtitle">Map 4 · Tokuno Islands (1448 × 1448)</p>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-pill"><span class="lbl">FPS</span><b id="fps-val">60</b></div>
        <div class="stat-pill"><span class="lbl">X, Y</span><b id="pos-val">724, 724</b></div>
        <div class="stat-pill"><span class="lbl">Chunk</span><b id="chunk-val">11, 11</b></div>
        <div class="stat-pill"><span class="lbl">Zoom</span><b id="zoom-val">1.0x</b></div>
      </div>
    </header>

    <!-- Top Right Minimap & Quick Teleport -->
    <aside class="hud-panel top-right minimap-panel">
      <div class="panel-header">
        <span>RADAR OVERVIEW</span>
      </div>
      <div class="minimap-container">
        <img id="minimap-img" src="/out/map4/overview/radar.webp" alt="Map 4 Radar Overview" />
        <div id="minimap-indicator"></div>
      </div>
      <div class="teleport-presets">
        <button class="preset-btn" data-x="368" data-y="744">Zento City</button>
        <button class="preset-btn" data-x="724" data-y="724">Island Center</button>
        <button class="preset-btn" data-x="980" data-y="520">Shrine of Valor</button>
        <button class="preset-btn" data-x="250" data-y="1020">Homare Docks</button>
      </div>
    </aside>

    <!-- Bottom Center Controls Dock -->
    <nav class="hud-panel bottom-center control-dock">
      <div class="control-group">
        <span class="grp-label">CAMERA</span>
        <div class="toggle-buttons">
          <button id="btn-mode-classic" class="btn active" title="Classic Isometric 2.5D View">Classic 2.5D</button>
          <button id="btn-mode-orbit" class="btn" title="Free 3D Orbit View">3D Orbit</button>
        </div>
      </div>

      <div class="control-group">
        <span class="grp-label">LAYERS</span>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-terrain" checked />
          <span>Terrain</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-statics" checked />
          <span>Statics</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-roofs" checked />
          <span>Roofs</span>
        </label>
      </div>

      <div class="control-group zoom-group">
        <span class="grp-label">ZOOM</span>
        <button id="btn-zoom-out" class="icon-btn" title="Zoom Out">−</button>
        <input type="range" id="zoom-slider" min="0.25" max="3.0" step="0.05" value="1.0" />
        <button id="btn-zoom-in" class="icon-btn" title="Zoom In">+</button>
      </div>
    </nav>

    <!-- Help / Keys Toast -->
    <div class="hud-panel bottom-left keys-tip">
      <p><b>Drag</b> to pan &bull; <b>Scroll</b> to zoom &bull; <b>Right-click drag</b> in 3D to rotate</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
